{% extends "base.html" %}

{% block title %}配置管理 - B站监控{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- 页面标题 -->
    <div>
        <h1 class="text-2xl font-bold text-gray-900">配置管理</h1>
        <p class="mt-1 text-sm text-gray-500">修改系统配置</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 基本配置 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium text-gray-900">基本配置</h2>
            </div>

            <form id="config-form" class="p-6 space-y-6">
                <!-- 检查间隔 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        检查间隔（分钟）
                    </label>
                    <input
                        type="number"
                        id="check-interval"
                        min="5"
                        max="1440"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        建议 30-60 分钟，最小 5 分钟
                    </p>
                </div>

                <!-- 最大UP主数 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        最大监控UP主数量
                    </label>
                    <input
                        type="number"
                        id="max-ups"
                        min="1"
                        max="100"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        监控的UP主数量上限，建议不超过 50
                    </p>
                </div>

                <!-- 飞书 Webhook -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        飞书 Webhook URL
                    </label>
                    <input
                        type="url"
                        id="feishu-webhook"
                        placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        飞书群机器人的 Webhook 地址
                    </p>
                </div>

                <!-- 操作按钮 -->
                <div class="flex justify-end space-x-3">
                    <button
                        type="button"
                        id="btn-reset-config"
                        class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
                    >
                        重置
                    </button>
                    <button
                        type="submit"
                        class="px-4 py-2 bg-bilibili-pink text-white rounded-lg text-sm font-medium hover:bg-pink-600 transition-colors"
                    >
                        保存配置
                    </button>
                </div>
            </form>
        </div>

        <!-- 测试推送 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium text-gray-900">测试推送</h2>
            </div>

            <div class="p-6 space-y-4">
                <p class="text-sm text-gray-600">
                    点击下方按钮发送测试消息到飞书群，验证 Webhook 配置是否正确。
                </p>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        测试消息内容
                    </label>
                    <input
                        type="text"
                        id="test-message"
                        value="这是一条测试消息"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                    >
                </div>

                <button
                    id="btn-test-push"
                    class="w-full bg-bilibili-blue text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors text-sm font-medium"
                >
                    发送测试消息
                </button>

                <!-- 测试结果 -->
                <div id="test-result" class="hidden mt-4 p-4 rounded-lg text-sm"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 页面加载时获取配置
    document.addEventListener('DOMContentLoaded', async function() {
        console.log('[Config] 开始加载配置');
        await loadConfig();
        bindEvents();
    });

    /**
     * 加载配置
     */
    async function loadConfig() {
        try {
            const config = await fetchAPI('/api/config');

            console.log('[Config] 配置加载成功:', config);

            // 填充表单
            document.getElementById('check-interval').value = config.check_interval_minutes || 30;
            document.getElementById('max-ups').value = config.max_ups || 50;
            document.getElementById('feishu-webhook').value = config.feishu_webhook_url || '';

        } catch (error) {
            console.error('[Config] 加载配置失败:', error);
            showError('加载配置失败: ' + error.message);
        }
    }

    /**
     * 绑定事件
     */
    function bindEvents() {
        // 保存配置
        document.getElementById('config-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            console.log('[Config] 保存配置');

            const checkInterval = parseInt(document.getElementById('check-interval').value);
            const maxUps = parseInt(document.getElementById('max-ups').value);
            const feishuWebhook = document.getElementById('feishu-webhook').value.trim();

            // 验证
            if (checkInterval < 5) {
                showError('检查间隔不能小于 5 分钟');
                return;
            }

            if (maxUps < 1 || maxUps > 100) {
                showError('UP主数量必须在 1-100 之间');
                return;
            }

            try {
                await fetchAPI('/api/config', {
                    method: 'PUT',
                    body: JSON.stringify({
                        check_interval_minutes: checkInterval,
                        max_ups: maxUps,
                        feishu_webhook_url: feishuWebhook || null
                    })
                });

                showSuccess('配置保存成功');

            } catch (error) {
                console.error('[Config] 保存失败:', error);
                showError('保存失败: ' + error.message);
            }
        });

        // 重置配置
        document.getElementById('btn-reset-config').addEventListener('click', async function() {
            console.log('[Config] 重置配置');

            document.getElementById('check-interval').value = 30;
            document.getElementById('max-ups').value = 50;
            document.getElementById('feishu-webhook').value = '';

            showSuccess('配置已重置');
        });

        // 测试推送
        document.getElementById('btn-test-push').addEventListener('click', async function() {
            console.log('[Config] 发送测试推送');

            const message = document.getElementById('test-message').value.trim();
            const resultDiv = document.getElementById('test-result');

            if (!message) {
                showError('请输入测试消息内容');
                return;
            }

            try {
                resultDiv.classList.remove('hidden', 'bg-red-50', 'text-red-700');
                resultDiv.classList.add('bg-blue-50', 'text-blue-700');
                resultDiv.textContent = '发送中...';

                // 调用飞书测试接口
                const response = await fetchAPI('/api/config/test-push', {
                    method: 'POST',
                    body: JSON.stringify({ message: message })
                });

                resultDiv.classList.remove('bg-blue-50', 'text-blue-700');
                resultDiv.classList.add('bg-green-50', 'text-green-700');
                resultDiv.textContent = '✓ 测试消息发送成功';

                showSuccess('测试推送成功');

            } catch (error) {
                console.error('[Config] 测试推送失败:', error);

                resultDiv.classList.remove('bg-blue-50', 'text-blue-700', 'bg-green-50', 'text-green-700');
                resultDiv.classList.add('bg-red-50', 'text-red-700');
                resultDiv.textContent = '✗ 发送失败: ' + error.message;

                showError('测试推送失败: ' + error.message);
            }
        });
    }
</script>
{% endblock %}
