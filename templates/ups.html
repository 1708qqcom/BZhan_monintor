{% extends "base.html" %}

{% block title %}UP主管理 - B站监控{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- 页面标题 -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">UP主管理</h1>
            <p class="mt-1 text-sm text-gray-500">管理监控的UP主列表</p>
        </div>
        <button
            id="btn-add-up"
            class="bg-bilibili-pink text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition-colors text-sm font-medium"
        >
            添加UP主
        </button>
    </div>

    <!-- 搜索筛选 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <div class="flex items-center space-x-4">
            <div class="flex-1">
                <input
                    type="text"
                    id="search-input"
                    placeholder="搜索UP主名称..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                >
            </div>
            <div class="flex items-center">
                <span class="text-sm text-gray-500 mr-2">共</span>
                <span id="total-count" class="text-sm font-bold text-gray-900">0</span>
                <span class="text-sm text-gray-500 ml-2">位UP主</span>
            </div>
        </div>
    </div>

    <!-- UP主列表 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- 桌面端表格 -->
        <div class="hidden md:block overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            UP主
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            监控状态
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            添加时间
                        </th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            操作
                        </th>
                    </tr>
                </thead>
                <tbody id="ups-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- 加载中 -->
                    <tr>
                        <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                            加载中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 移动端卡片列表 -->
        <div id="ups-mobile-list" class="md:hidden divide-y divide-gray-200">
            <!-- 加载中 -->
            <div class="text-center py-12 text-gray-500">
                加载中...
            </div>
        </div>
    </div>
</div>

<!-- 添加UP主模态框 -->
<div id="add-up-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-md w-full p-6">
        <h3 class="text-lg font-medium text-gray-900 mb-4">添加UP主</h3>

        <form id="add-up-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    UP主 ID (mid)
                </label>
                <input
                    type="number"
                    id="up-mid-input"
                    required
                    placeholder="输入B站UP主ID"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-bilibili-pink focus:border-bilibili-pink text-sm"
                >
                <p class="text-xs text-gray-500 mt-1">
                    例如: 12345678 (可在B站UP主主页URL中找到)
                </p>
            </div>

            <div class="flex justify-end space-x-3">
                <button
                    type="button"
                    id="btn-cancel-add"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
                >
                    取消
                </button>
                <button
                    type="submit"
                    class="px-4 py-2 bg-bilibili-pink text-white rounded-lg text-sm font-medium hover:bg-pink-600 transition-colors"
                >
                    添加
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 全局状态
    let allUps = [];

    // 页面加载时获取数据
    document.addEventListener('DOMContentLoaded', async function() {
        console.log('[Ups] 开始加载UP主列表');
        await loadUps();

        // 绑定事件
        bindEvents();
    });

    /**
     * 加载UP主列表
     */
    async function loadUps() {
        try {
            const response = await fetchAPI('/api/ups');
            allUps = response.items || [];

            console.log('[Ups] 加载完成:', allUps.length, '个UP主');

            renderUpsList(allUps);
            updateTotalCount(allUps.length);

        } catch (error) {
            console.error('[Ups] 加载失败:', error);
            showError('加载UP主列表失败: ' + error.message);
        }
    }

    /**
     * 渲染UP主列表
     */
    function renderUpsList(ups) {
        // 桌面端表格
        const tableBody = document.getElementById('ups-table-body');

        if (ups.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                        暂无UP主，点击右上角"添加UP主"按钮添加
                    </td>
                </tr>
            `;
        } else {
            tableBody.innerHTML = ups.map(up => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10">
                                <img class="h-10 w-10 rounded-full" src="${up.face || 'https://via.placeholder.com/40'}" alt="${escapeHtml(up.name)}" referrerpolicy="no-referrer">
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${escapeHtml(up.name)}</div>
                                <div class="text-sm text-gray-500">mid: ${up.mid}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${up.is_monitoring ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                            ${up.is_monitoring ? '监控中' : '已停止'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDateTime(up.created_at)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button
                            onclick="removeUp(${up.id}, '${escapeHtml(up.name)}')"
                            class="text-red-600 hover:text-red-900 transition-colors"
                        >
                            移除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 移动端卡片
        const mobileList = document.getElementById('ups-mobile-list');

        if (ups.length === 0) {
            mobileList.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    暂无UP主，点击右上角"添加UP主"按钮添加
                </div>
            `;
        } else {
            mobileList.innerHTML = ups.map(up => `
                <div class="p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-start space-x-3">
                        <img class="h-10 w-10 rounded-full flex-shrink-0" src="${up.face || 'https://via.placeholder.com/40'}" alt="${escapeHtml(up.name)}" referrerpolicy="no-referrer">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900">${escapeHtml(up.name)}</p>
                            <p class="text-xs text-gray-500">mid: ${up.mid}</p>
                            <p class="text-xs text-gray-500 mt-1">${formatDateTime(up.created_at)}</p>
                        </div>
                        <div class="flex-shrink-0">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${up.is_monitoring ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                                ${up.is_monitoring ? '监控中' : '已停止'}
                            </span>
                        </div>
                    </div>
                    <div class="mt-3 flex justify-end">
                        <button
                            onclick="removeUp(${up.id}, '${escapeHtml(up.name)}')"
                            class="text-xs text-red-600 hover:text-red-900 transition-colors"
                        >
                            移除
                        </button>
                    </div>
                </div>
            `).join('');
        }
    }

    /**
     * 更新总数
     */
    function updateTotalCount(count) {
        document.getElementById('total-count').textContent = count;
    }

    /**
     * 绑定事件
     */
    function bindEvents() {
        // 添加UP主按钮
        document.getElementById('btn-add-up').addEventListener('click', function() {
            document.getElementById('add-up-modal').classList.remove('hidden');
        });

        // 取消添加
        document.getElementById('btn-cancel-add').addEventListener('click', function() {
            document.getElementById('add-up-modal').classList.add('hidden');
        });

        // 点击模态框背景关闭
        document.getElementById('add-up-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.add('hidden');
            }
        });

        // 提交添加表单
        document.getElementById('add-up-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const midInput = document.getElementById('up-mid-input');
            const mid = parseInt(midInput.value);

            if (!mid) {
                showError('请输入有效的UP主ID');
                return;
            }

            console.log('[Ups] 添加UP主:', mid);

            try {
                await fetchAPI('/api/ups', {
                    method: 'POST',
                    body: JSON.stringify({ mid: mid })
                });

                showSuccess('UP主添加成功');
                document.getElementById('add-up-modal').classList.add('hidden');
                midInput.value = '';

                // 重新加载列表
                await loadUps();

            } catch (error) {
                console.error('[Ups] 添加失败:', error);
                showError('添加失败: ' + error.message);
            }
        });

        // 搜索输入
        document.getElementById('search-input').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            console.log('[Ups] 搜索:', keyword);

            if (keyword) {
                const filtered = allUps.filter(up =>
                    up.name.toLowerCase().includes(keyword) ||
                    String(up.mid).includes(keyword)
                );
                renderUpsList(filtered);
                updateTotalCount(filtered.length);
            } else {
                renderUpsList(allUps);
                updateTotalCount(allUps.length);
            }
        });
    }

    /**
     * 移除UP主
     */
    async function removeUp(upId, upName) {
        const confirmed = confirm(`确定要移除UP主 "${upName}" 吗？`);

        if (!confirmed) {
            return;
        }

        console.log('[Ups] 移除UP主:', upId);

        try {
            await fetchAPI(`/api/ups/${upId}`, {
                method: 'DELETE'
            });

            showSuccess('UP主已移除');

            // 重新加载列表
            await loadUps();

        } catch (error) {
            console.error('[Ups] 移除失败:', error);
            showError('移除失败: ' + error.message);
        }
    }
</script>
{% endblock %}
