# CI 流水线：代码推送 / PR 时自动执行 Lint + 单元测试
# 任一阶段失败即阻断合并与下游 CD

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同一分支上未完成的旧运行，避免并发浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 单元测试（pytest）
        run: pytest tests/
